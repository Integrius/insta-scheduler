name: Daily Instagram Publish

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install publish script dependencies
        working-directory: scripts/publish
        run: npm install

      - name: Build publish script
        working-directory: scripts/publish
        run: npm run build

      - name: Run daily publish
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: node scripts/publish/dist/cli.js

      - name: Commit updated queue and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json history.json
          git diff --staged --quiet || git commit -m "chore: update publish queue [skip ci]"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              pushed=true
              break
            fi
            sleep 5
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::Failed to push queue.json/history.json after 3 attempts — a publish may have already happened and could re-run tomorrow. Manual check required." >&2
            exit 1
          fi
